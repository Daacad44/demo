<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2040"><title>Bulsho Car Rental | Interactive Demo</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#142238;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:#0c2243;color:#d8e6fa;padding:26px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:900;font-size:22px;color:white;margin:0 8px 4px}.tag{font-size:11px;color:#8ab7ea;margin:0 8px 25px}.nav{display:block;width:100%;padding:12px 14px;border:0;text-align:left;background:none;color:#d2e1f2;border-radius:11px;margin:3px 0}.nav.active,.nav:hover{background:#1e4575;color:white}.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 32px;background:white;border-bottom:1px solid #e5eaf1;position:sticky;top:0;z-index:3}.content{max-width:1450px;margin:auto;padding:30px}.small{font-size:12px;color:#7d8b9d}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#2c79bf;font-weight:800}h1{font-size:clamp(26px,3vw,39px);margin:6px 0 8px}h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 9px}.muted{color:#7a899d}.btn{background:#1464ad;border:1px solid #1464ad;color:white;padding:11px 17px;border-radius:10px;font-weight:700}.btn.alt{background:white;color:#164c82;border-color:#d5dfeb}.btn.warn{background:#f0aa3d;border-color:#f0aa3d;color:#10243f}.btn.danger{background:#b53043;border-color:#b53043}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0}.card,.panel{background:white;border:1px solid #e3e9f2;border-radius:16px;padding:21px;box-shadow:0 5px 22px #0e305308}.metric{font-size:30px;font-weight:850;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.hero{background:linear-gradient(105deg,#071e3c 0%,#123f6c 62%,#2179b7 100%);border-radius:22px;color:white;padding:54px 42px;margin-bottom:22px;overflow:hidden;position:relative}.hero:after{content:'🚙';position:absolute;font-size:170px;right:5%;top:2%;opacity:.25}.hero p{max-width:530px;line-height:1.7;color:#d9e8f7}.hero .btn{position:relative;z-index:1}.carart{height:145px;background:linear-gradient(135deg,#e6f1f9,#bad5eb);border-radius:12px;display:grid;place-items:center;font-size:75px;margin-bottom:14px}.pill{display:inline-block;border-radius:100px;background:#e8f3ff;color:#1465a4;padding:5px 10px;font-size:12px;font-weight:700}.pill.green{background:#e0f7e9;color:#167444}.pill.orange{background:#fff1d8;color:#96600b}.pill.red{background:#ffeaed;color:#a02b3c}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border-radius:9px;border:1px solid #d6e0eb;background:white;color:#15243a}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{padding:13px;text-align:left;border-bottom:1px solid #edf0f5;font-size:13px}th{color:#728196;font-weight:750}table{min-width:600px}.scroll{overflow:auto}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.bar{height:11px;background:#eaf0f7;border-radius:30px;overflow:hidden}.bar>span{height:100%;display:block;background:#2583c9;border-radius:30px}.chartrow{display:grid;grid-template-columns:45px 1fr 75px;align-items:center;gap:10px;margin:14px 0;font-size:12px}.toast{position:fixed;bottom:20px;right:20px;background:#102f51;color:white;padding:14px 18px;border-radius:12px;z-index:10;box-shadow:0 10px 30px #0004}.mobilemenu{display:none}.dark{background:#101b2c;color:#e9f0fa}.dark .top,.dark .panel,.dark .card{background:#192940;color:#e9f0fa;border-color:#30445c}.dark .muted,.dark .small{color:#b1bed0}.dark .field input,.dark .field select{background:#14243b;color:white;border-color:#3a5068}.dark th,.dark td{border-color:#34455b}.dark .btn.alt{background:#233956;color:#e6efff;border-color:#49607a}.dark .bar{background:#33445b}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.shell{display:block}.side{position:fixed;left:-260px;top:0;bottom:0;width:245px;z-index:9;transition:left .2s}.side.open{left:0}.mobilemenu{display:inline-block}.top{padding:14px}.content{padding:18px}.cards,.grid,.form{grid-template-columns:1fr}.hero{padding:35px 24px}.hero:after{font-size:90px;top:28%}.metric{font-size:26px}.full{grid-column:auto}}
</style></head><body><div id="app"></div><script>
const SEED={vehicles:[{id:1,name:'Toyota Land Cruiser V8',category:'Luxury SUV',rate:140,status:'Rented',plate:'BC-101',emoji:'🚙'},{id:2,name:'Toyota Prado TX',category:'SUV',rate:85,status:'Available',plate:'BC-102',emoji:'🚘'},{id:3,name:'Toyota Hilux',category:'Pickup',rate:75,status:'Reserved',plate:'BC-103',emoji:'🛻'},{id:4,name:'Hyundai Tucson',category:'SUV',rate:60,status:'Maintenance',plate:'BC-104',emoji:'🚗'},{id:5,name:'Toyota Corolla',category:'Sedan',rate:45,status:'Available',plate:'BC-105',emoji:'🚗'},{id:6,name:'Nissan Patrol',category:'Luxury SUV',rate:115,status:'Available',plate:'BC-106',emoji:'🚙'}],customers:[{id:1,name:'Amina Hassan',phone:'252610000001'},{id:2,name:'Mohamed Ali',phone:'252610000002'},{id:3,name:'Hodan Yusuf',phone:'252610000003'}],drivers:[{id:1,name:'Ahmed Noor',phone:'252610000010',status:'Available'},{id:2,name:'Abdi Omar',phone:'252610000011',status:'On Trip'},{id:3,name:'Farah Jama',phone:'252610000012',status:'Available'}],bookings:[{id:1001,vehicleId:1,customer:'Amina Hassan',days:4,total:560,status:'Active',date:'2026-10-15'},{id:1002,vehicleId:3,customer:'Mohamed Ali',days:3,total:225,status:'Pending',date:'2026-10-18'},{id:1003,vehicleId:2,customer:'Hodan Yusuf',days:2,total:170,status:'Completed',date:'2026-10-10'}],expenses:[{id:1,label:'Vehicle servicing',amount:190},{id:2,label:'Fuel and cleaning',amount:75}],maintenance:[{id:1,vehicleId:4,issue:'Scheduled inspection',status:'In progress'}]};
const KEY='bulsho-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch{state=structuredClone(SEED)};let view='home',lang='en',dark=false,filter='All',bookingVehicle=null,search='',mobile=false;const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),money=n=>'$'+Number(n||0).toLocaleString('en-US'),vname=id=>state.vehicles.find(v=>v.id===Number(id))?.name||'Unknown',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={en:{home:'Public Website',fleet:'Fleet Management',booking:'Book a Car',admin:'Admin Dashboard',reservations:'Reservations',customers:'Customers',drivers:'Drivers',finance:'Finance',maintenance:'Maintenance',reports:'Reports',customer:'Customer Portal',driver:'Driver Portal'},so:{home:'Website-ka',fleet:'Maamulka Baabuurta',booking:'Qabso Gaari',admin:'Dashboard Maamul',reservations:'Boos Celinta',customers:'Macaamiisha',drivers:'Darawallada',finance:'Maaliyadda',maintenance:'Dayactirka',reports:'Warbixinnada',customer:'Bogga Macaamilka',driver:'Bogga Darawalka'}};const navs=['home','booking','customer','admin','fleet','reservations','customers','drivers','driver','finance','maintenance','reports'];function go(n){view=n;mobile=false;render();window.scrollTo(0,0)}function pill(s){return `<span class="pill ${['Available','Completed','Active','Paid'].includes(s)?'green':['Pending','Reserved','In progress'].includes(s)?'orange':['Maintenance','Cancelled'].includes(s)?'red':''}">${esc(s)}</span>`}function notice(msg){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),2700)}function cards(){let active=state.bookings.filter(b=>b.status==='Active').length;let revenue=state.bookings.filter(b=>b.status!=='Cancelled').reduce((a,b)=>a+b.total,0);return `<div class="cards">${[['Fleet vehicles',state.vehicles.length],['Active rentals',active],['Total bookings',state.bookings.length],['Demo booking value',money(revenue)]].map(x=>`<div class="card"><div class="small">${x[0]}</div><div class="metric">${x[1]}</div><div class="small">Sample data only</div></div>`).join('')}</div>`}
function vehicleCards(arr,action='book'){return `<div class="grid">${arr.map(v=>`<div class="panel"><div class="carart">${v.emoji}</div><div class="sectionhead"><h3>${esc(v.name)}</h3>${pill(v.status)}</div><div class="muted">${esc(v.category)} · ${esc(v.plate)}</div><p><b>${money(v.rate)}/day</b></p><button class="btn" ${v.status!=='Available'&&action==='book'?'disabled':''} onclick="${action==='book'?`startBooking(${v.id})`:`editVehicle(${v.id})`}">${action==='book'?'Book this car':'Edit vehicle'}</button></div>`).join('')}</div>`}
function home(){return `<div class="hero"><div class="eyebrow" style="color:#e9b85b">BULSHO CAR RENTAL · INTERACTIVE DEMO</div><h1>Find your perfect ride<br>in Mogadishu.</h1><p>Discover reliable vehicles, compare rental rates and explore a seamless car booking experience. All inventory and prices here are fictional demo data.</p><div class="actions"><button class="btn warn" onclick="go('booking')">Explore & Book Cars →</button><button class="btn alt" onclick="go('admin')">View Admin Dashboard</button></div></div><div class="sectionhead"><h2>Featured vehicles</h2><button class="btn alt" onclick="go('fleet')">Explore fleet</button></div>${vehicleCards(state.vehicles.filter(v=>v.status==='Available').slice(0,3))}<div class="cards">${[['01','Choose your vehicle'],['02','Select your dates'],['03','Confirm mock booking'],['04','View in dashboard']].map(a=>`<div class="card"><div class="eyebrow">${a[0]}</div><h3>${a[1]}</h3><p class="muted">An easy, transparent rental journey.</p></div>`).join('')}</div>`}
function booking(){let available=state.vehicles.filter(v=>v.status==='Available'&&(filter==='All'||v.category===filter));return `<div class="sectionhead"><div><div class="eyebrow">Customer experience</div><h1>Book your next car</h1><p class="muted">Choose a vehicle and complete a simulated reservation.</p></div></div><div class="panel" style="margin-bottom:18px"><div class="actions">${['All','SUV','Luxury SUV','Sedan','Pickup'].map(c=>`<button class="btn ${filter===c?'':'alt'}" onclick="filter=${JSON.stringify(c)};render()">${c}</button>`).join('')}</div></div>${vehicleCards(available)}${available.length?'':'<div class="panel">No vehicles match your filters.</div>'}`}
function startBooking(id){bookingVehicle=id;view='checkout';render();window.scrollTo(0,0)}function checkout(){let v=state.vehicles.find(x=>x.id===bookingVehicle);if(!v||v.status!=='Available')return '<div class="panel">Vehicle unavailable. <button class="btn" onclick="go(\'booking\')">Back</button></div>';return `<h1>Complete demo booking</h1><div class="two"><div class="panel"><form id="bookForm" class="form"><label class="field">Full name<input name="customer" required minlength="2" placeholder="Enter sample name"></label><label class="field">Phone (demo only)<input name="phone" required placeholder="25261..."></label><label class="field">Pickup date<input name="date" type="date" required min="${new Date().toISOString().slice(0,10)}"></label><label class="field">Rental days<input name="days" type="number" min="1" max="90" value="3" required oninput="document.getElementById('preview').textContent=money(this.value*${v.rate})"></label><label class="field full">Driver option<select name="driver"><option value="no">Self drive</option><option value="yes">With driver (arranged separately)</option></select></label><div class="full"><button class="btn" type="submit">Confirm demo reservation</button></div></form></div><div class="panel"><div class="carart">${v.emoji}</div><h2>${esc(v.name)}</h2><p class="muted">${esc(v.category)} · ${esc(v.plate)}</p><p>Rate: ${money(v.rate)} / day</p><h2 id="preview">${money(v.rate*3)}</h2><div class="small">No payment is processed. Driver fees are not included in this mock estimate.</div></div></div>`}
function admin(){return `<div class="eyebrow">Business intelligence</div><h1>Operations overview</h1><p class="muted">All figures are fictional and update when you interact with the demo.</p>${cards()}<div class="two"><div class="panel"><div class="sectionhead"><h2>Recent reservations</h2><button class="btn alt" onclick="go('reservations')">View all</button></div>${bookingTable(state.bookings.slice(-5).reverse(),false)}</div><div class="panel"><h2>Fleet status</h2>${['Available','Rented','Reserved','Maintenance'].map(s=>{let n=state.vehicles.filter(v=>v.status===s).length;return `<div class="chartrow"><span>${s}</span><div class="bar"><span style="width:${100*n/Math.max(1,state.vehicles.length)}%"></span></div><b>${n}</b></div>`}).join('')}<div class="actions"><button class="btn" onclick="go('fleet')">Manage fleet</button><button class="btn alt" onclick="go('reports')">Reports</button></div></div></div>`}
function bookingTable(arr,edit=true){return `<div class="scroll"><table><thead><tr><th>ID</th><th>Customer</th><th>Vehicle</th><th>Days</th><th>Amount</th><th>Status</th>${edit?'<th>Action</th>':''}</tr></thead><tbody>${arr.map(b=>`<tr><td>#${b.id}</td><td>${esc(b.customer)}</td><td>${esc(vname(b.vehicleId))}</td><td>${b.days}</td><td>${money(b.total)}</td><td>${pill(b.status)}</td>${edit?`<td><select onchange="updateBooking(${b.id},this.value)">${['Pending','Active','Completed','Cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function fleet(){return `<div class="sectionhead"><div><div class="eyebrow">Fleet operations</div><h1>Vehicle management</h1></div><button class="btn" onclick="addVehicle()">+ Add demo vehicle</button></div>${vehicleCards(state.vehicles,'edit')}`}
function reservations(){return `<div class="sectionhead"><h1>Reservations</h1><button class="btn" onclick="go('booking')">+ New booking</button></div><div class="panel">${bookingTable(state.bookings.slice().reverse())}</div>`}
function customers(){return `<div class="sectionhead"><h1>Customers</h1><button class="btn" onclick="addCustomer()">+ Add customer</button></div><div class="panel scroll"><table><tr><th>Customer ID</th><th>Name</th><th>Phone</th><th>Bookings</th></tr>${state.customers.map(c=>`<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${state.bookings.filter(b=>b.customer===c.name).length}</td></tr>`).join('')}</table></div>`}
function drivers(){return `<div class="sectionhead"><h1>Driver management</h1><button class="btn" onclick="addDriver()">+ Add driver</button></div><div class="grid">${state.drivers.map(d=>`<div class="panel"><div class="carart" style="height:90px;font-size:45px">👨‍✈️</div><h3>${esc(d.name)}</h3><p class="muted">${esc(d.phone)}</p>${pill(d.status)}<p><button class="btn alt" onclick="toggleDriver(${d.id})">Toggle availability</button></p></div>`).join('')}</div>`}
function finance(){let total=state.bookings.filter(b=>b.status!=='Cancelled').reduce((s,b)=>s+b.total,0),expenses=state.expenses.reduce((s,e)=>s+e.amount,0);return `<h1>Finance & invoices</h1><p class="muted">Simulated values only — no money moves.</p><div class="cards">${[['Mock revenue',money(total)],['Mock expenses',money(expenses)],['Net demo balance',money(total-expenses)],['Invoice count',state.bookings.length]].map(x=>`<div class="card"><div class="small">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="two"><div class="panel"><h2>Sample invoices</h2>${bookingTable(state.bookings,false)}</div><div class="panel"><div class="sectionhead"><h2>Expenses</h2><button class="btn" onclick="addExpense()">+ Expense</button></div>${state.expenses.map(e=>`<p>${esc(e.label)} <b style="float:right">${money(e.amount)}</b></p>`).join('')}</div></div>`}
function maintenance(){return `<div class="sectionhead"><h1>Maintenance & inspections</h1><button class="btn" onclick="addMaintenance()">+ Log service</button></div><div class="panel scroll"><table><tr><th>ID</th><th>Vehicle</th><th>Issue</th><th>Status</th></tr>${state.maintenance.map(m=>`<tr><td>${m.id}</td><td>${esc(vname(m.vehicleId))}</td><td>${esc(m.issue)}</td><td>${pill(m.status)}</td></tr>`).join('')}</table></div><p class="muted">Production will include damage photos, odometer readings, checklists and service reminders.</p>`}
function reports(){let by=state.vehicles.map(v=>({name:v.name,value:state.bookings.filter(b=>b.vehicleId===v.id&&b.status!=='Cancelled').reduce((s,b)=>s+b.total,0)}));let max=Math.max(1,...by.map(x=>x.value));return `<h1>Business reports</h1>${cards()}<div class="panel"><h2>Rental value by vehicle</h2>${by.map(x=>`<div class="chartrow" style="grid-template-columns:160px 1fr 80px"><span>${esc(x.name)}</span><div class="bar"><span style="width:${100*x.value/max}%"></span></div><b>${money(x.value)}</b></div>`).join('')}<button class="btn alt" onclick="exportCSV()">Export bookings CSV</button></div>`}
function customer(){return `<div class="eyebrow">Customer self-service preview</div><h1>My rental portal</h1><p class="muted">Illustrative customer account — demo records are shared within this browser.</p><div class="cards">${[['My bookings',state.bookings.length],['Active rentals',state.bookings.filter(b=>b.status==='Active').length],['Invoices',state.bookings.length],['Support','Demo']].map(x=>`<div class="card"><div class="small">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="panel"><h2>Booking history</h2>${bookingTable(state.bookings,false)}</div>`}
function driver(){return `<div class="eyebrow">Driver mobile portal preview</div><h1>My assigned trips</h1><div class="grid">${state.bookings.filter(b=>b.status==='Active'||b.status==='Pending').map(b=>`<div class="panel"><h3>${esc(vname(b.vehicleId))}</h3><p>Booking #${b.id}</p><p>Customer: ${esc(b.customer)}</p>${pill(b.status)}<p><button class="btn alt" onclick="notice('Demo inspection checklist opened — production workflow preview')">Open inspection checklist</button></p></div>`).join('')}</div>`}
function render(){document.body.className=dark?'dark':'';$('#app').innerHTML=`<div class="shell"><aside class="side ${mobile?'open':''}"><div class="brand">🚙 BULSHO</div><div class="tag">CAR RENTAL · DEMO ENVIRONMENT</div>${navs.map(n=>`<button class="nav ${view===n?'active':''}" onclick="go('${n}')">${({home:'⌂',booking:'▦',customer:'♙',admin:'▤',fleet:'🚘',reservations:'▣',customers:'♧',drivers:'♟',driver:'↗',finance:'$',maintenance:'⚙',reports:'▥'})[n]} &nbsp; ${labels[lang][n]}</button>`).join('')}<hr style="border:0;border-top:1px solid #2a486b;margin:18px 0"><button class="nav" onclick="resetDemo()">↺ &nbsp; Reset demo data</button><p class="tag">Fictional data. No real transactions.</p></aside><main class="main"><header class="top"><div class="actions"><button class="btn alt mobilemenu" onclick="mobile=!mobile;render()">☰ Menu</button><b>Bulsho Car Rental</b><span class="pill">INTERACTIVE DEMO</span></div><div class="actions"><button class="btn alt" onclick="lang=lang==='en'?'so':'en';render()">${lang==='en'?'SO':'EN'}</button><button class="btn alt" onclick="dark=!dark;render()">${dark?'☀':'☾'}</button></div></header><div class="content">${({home,booking,checkout,admin,fleet,reservations,customers,drivers,finance,maintenance,reports,customer,driver})[view]()}</div></main></div>`;let f=$('#bookForm');if(f)f.addEventListener('submit',submitBooking)}
function submitBooking(e){e.preventDefault();let f=new FormData(e.target),v=state.vehicles.find(x=>x.id===bookingVehicle);if(!v||v.status!=='Available')return notice('Vehicle is not available');let days=Number(f.get('days'));if(!Number.isInteger(days)||days<1||days>90)return notice('Invalid rental duration');let name=String(f.get('customer')).trim(),phone=String(f.get('phone')).trim();if(!name||!phone)return notice('Complete required fields');let id=Math.max(1000,...state.bookings.map(b=>b.id))+1;state.bookings.push({id,vehicleId:v.id,customer:name,days,total:days*v.rate,status:'Pending',date:String(f.get('date'))});state.customers.push({id:Date.now(),name,phone});v.status='Reserved';save();go('reservations');notice('Demo booking #'+id+' created — visible in admin reservations')}
function updateBooking(id,status){let b=state.bookings.find(x=>x.id===id);if(!b)return;b.status=status;let v=state.vehicles.find(x=>x.id===b.vehicleId);if(v){v.status=status==='Active'?'Rented':status==='Pending'?'Reserved':'Available'}save();render();notice('Reservation status updated')}
function addVehicle(){let name=prompt('Vehicle name (sample only)');if(!name?.trim())return;let rate=Number(prompt('Daily rate in USD','70'));if(!Number.isFinite(rate)||rate<=0)return notice('Invalid rate');state.vehicles.push({id:Date.now(),name:name.trim(),category:'SUV',rate,status:'Available',plate:'DEMO-'+(state.vehicles.length+1),emoji:'🚘'});save();render();notice('Demo vehicle added')}
function editVehicle(id){let v=state.vehicles.find(x=>x.id===id);let status=prompt('Vehicle status: Available, Rented, Reserved, Maintenance',v.status);if(!['Available','Rented','Reserved','Maintenance'].includes(status))return notice('Invalid status');v.status=status;save();render();notice('Vehicle updated')}
function addCustomer(){let name=prompt('Customer name (sample only)');if(!name?.trim())return;let phone=prompt('Demo phone number','252610000000');if(phone===null)return;state.customers.push({id:Date.now(),name:name.trim(),phone});save();render();notice('Customer added')}
function addDriver(){let name=prompt('Driver name (sample only)');if(!name?.trim())return;state.drivers.push({id:Date.now(),name:name.trim(),phone:'DEMO',status:'Available'});save();render();notice('Driver added')}
function toggleDriver(id){let d=state.drivers.find(x=>x.id===id);d.status=d.status==='Available'?'On Trip':'Available';save();render()}
function addExpense(){let label=prompt('Expense description');if(!label?.trim())return;let amount=Number(prompt('Amount USD','50'));if(!Number.isFinite(amount)||amount<=0)return notice('Invalid amount');state.expenses.push({id:Date.now(),label:label.trim(),amount});save();render();notice('Expense added')}
function addMaintenance(){let id=Number(prompt('Vehicle ID (see fleet)',state.vehicles[0]?.id));if(!state.vehicles.some(v=>v.id===id))return notice('Vehicle ID not found');let issue=prompt('Service description');if(!issue?.trim())return;state.maintenance.push({id:Date.now(),vehicleId:id,issue:issue.trim(),status:'In progress'});let v=state.vehicles.find(v=>v.id===id);v.status='Maintenance';save();render();notice('Maintenance record added')}
function exportCSV(){let rows=[['Booking ID','Customer','Vehicle','Days','Total','Status'],...state.bookings.map(b=>[b.id,b.customer,vname(b.vehicleId),b.days,b.total,b.status])];let csv=rows.map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bulsho-demo-bookings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetDemo(){if(!confirm('Reset all browser-local demo changes?'))return;state=structuredClone(SEED);save();go('home');notice('Demo reset successfully')}
render();
</script></body></html>
